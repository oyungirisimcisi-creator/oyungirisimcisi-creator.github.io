<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BALANCE</title>
<meta name="description" content="BALANCE – Taşları dengele, rekoru kır. Weigh each stone, stay level.">
<meta property="og:title" content="BALANCE">
<meta property="og:description" content="Taşları dengele, rekoru kır. / Weigh each stone, stay level.">
<style>
  :root {
    --bg: #f5ede0;
    --card: #fffaf0;
    --text: #3e2a20;
    --muted: #7a6458;
    --accent: #6d4c41;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1d1714;
      --card: #2a211d;
      --text: #f1e6da;
      --muted: #b8a597;
      --accent: #d7a98c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    text-align: center;
  }
  main { max-width: 420px; padding: 32px 16px; }
  h1 { margin: 0; font-size: 44px; letter-spacing: 3px; color: var(--accent); }
  p { margin: 6px 0 28px; color: var(--muted); }
  a.store {
    display: block; margin: 12px auto; padding: 14px 20px; max-width: 280px;
    border-radius: 999px; background: var(--accent); color: var(--card);
    text-decoration: none; font-weight: 700;
  }
</style>
</head>
<body>
<main>
  <h1>BALANCE</h1>
  <p>Taşları dengele, rekoru kır.<br>Weigh each stone, stay level.</p>
  <a class="store" id="play" href="https://play.google.com/store/apps/details?id=com.kalfagames.balance">Google Play</a>
  <a class="store" id="appstore" href="https://apps.apple.com/app/id6825082553">App Store</a>
</main>
<script>
  // Send phones straight to their own store; everyone else picks a button.
  var ua = navigator.userAgent || "";
  var iOS = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && "ontouchend" in document);
  if (/Android/i.test(ua)) {
    location.replace(document.getElementById("play").href);
  } else if (iOS) {
    location.replace(document.getElementById("appstore").href);
  }
</script>
</body>
</html>
